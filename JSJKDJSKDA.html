<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OLIIII</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(to right, #fbc2eb, #a6c1ee);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #d1f2eb;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #ff4d6d;
            font-size: 3em;
        }

        p {
            font-size: 1.2em;
            color: #555;
        }

        
        .heart-img {
            width: 120px;
            animation: pulse 1s infinite;
            cursor: pointer;
            margin-top: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #message {
            margin-top: 20px;
            font-size: 1.2em;
            color: #5a9b8c;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        #message.visible {
            opacity: 1;
        }

        .click-hint {
            font-size: 1em;
            color: #6c6c6c;
            margin-top: 10px;
            animation: float 2s infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 0.7; }
            50% { transform: translateY(-5px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ALOOOOOOV(♡´౪`♡)</h1>
        <p>Esta página es solo para tu (っ´ω`c)♡</p>
        <img src="corazon.jpg" alt="corazón" class="heart-img" id="heart">
        <div class="click-hint">Haz clic en el corazón jsjsjsj</div>
        <div id="message">Estoy siendo muy feliz contigo y estoy muy orgullosa de ti! Muaaak (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const heart = document.getElementById("heart");
            const message = document.getElementById("message");

            heart.addEventListener("click", () => {
                message.classList.add("visible");
            });
        });
    </script>
</body>
</html>
